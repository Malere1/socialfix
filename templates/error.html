
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found | SocialFix</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            font-family: Arial, Helvetica, sans-serif;
            color: #202124;
            background: #f5f7fb;
        }

        .error-card {
            width: 100%;
            max-width: 480px;
            padding: 40px 28px;
            text-align: center;
            background: white;
            border: 1px solid #e7eaf0;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(20, 30, 60, 0.10);
        }

        .logo {
            font-size: 25px;
            font-weight: 800;
            color: #2563eb;
        }

        .error-code {
            margin: 28px 0 8px;
            font-size: 64px;
            font-weight: 800;
            color: #2563eb;
        }

        h1 {
            margin: 0 0 12px;
            font-size: 25px;
        }

        p {
            color: #667085;
            line-height: 1.7;
        }

        a {
            display: inline-block;
            margin-top: 18px;
            padding: 14px 24px;
            color: white;
            background: #2563eb;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 700;
        }

        a:hover {
            background: #1d4ed8;
        }
    </style>
</head>
<body>
    <main class="error-card">
        <div class="logo">SocialFix</div>
        <div class="error-code">404</div>
        <h1>Page not found</h1>
        <p>
            Sorry, this page could not be found.
            Check the address or return to the homepage.
        </p>
        <a href="/">Back to Home</a>
    </main>
</body>
</html>
