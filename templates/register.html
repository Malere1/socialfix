
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SocialFix | Register</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0; min-height: 100vh; display: flex;
            align-items: center; justify-content: center;
            padding: 20px; font-family: Arial, sans-serif;
            background: #0b1120; color: #e5e7eb;
        }
        .card {
            width: 100%; max-width: 440px; padding: 32px;
            background: #111a2e; border: 1px solid #26344d;
            border-radius: 16px;
        }
        h1 { color: #60a5fa; }
        label { display: block; margin: 16px 0 8px; }
        input {
            width: 100%; padding: 12px; border-radius: 8px;
            border: 1px solid #334155; background: #0b1120; color: white;
        }
        button {
            width: 100%; padding: 13px; margin-top: 22px;
            border: 0; border-radius: 8px; background: #60a5fa;
            font-weight: bold; cursor: pointer;
        }
        a { color: #60a5fa; }
        .message { padding: 10px; background: #1e293b; border-radius: 8px; }
    </style>
</head>
<body>
    <main class="card">
        <h1>Create your SocialFix account</h1>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <p class="message">{{ message }}</p>
            {% endfor %}
        {% endwith %}

        <form method="POST" action="{{ url_for('register') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <label for="name">Full name</label>
            <input id="name" type="text" name="name" required autocomplete="name">

            <label for="email">Email address</label>
            <input id="email" type="email" name="email" required autocomplete="email">

            <label for="password">Password (at least 8 characters)</label>
            <input id="password" type="password" name="password" minlength="8" required autocomplete="new-password">

            <button type="submit">Create Account</button>
        </form>

        <p>Already registered? <a href="{{ url_for('login') }}">Log in</a></p>
        <p><a href="{{ url_for('index') }}">Back to home</a></p>
    </main>
</body>
</html>
